    "Verified 2026-06-04 against agent_dir/dist/syd-3.60.0-x86_64-pc-linux-gnu.tar.xz: sha512 matches, and the minisign signature by key b1e47bc29cc65132 (algorithm Ed, pure ed25519 over the file) is valid. agent_dir/spike/minisign_verify.py performs the check; the sig file carries no signed trusted comment. Trust anchor: the key was fetched over TLS from the upstream repository named in the signature comment.",
