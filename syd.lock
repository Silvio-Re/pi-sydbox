    "Source build 3.59.0 (2026-11-23) is the engine to use on this 6.8 kernel. It needs libseccomp >= 2.6.0 behind it: the apt 2.5.5 headers compile but the link fails on seccomp_export_bpf_mem, so libseccomp 2.6.0 is built from source as well (build-libseccomp.sh builds gperf into the workdir when absent). The binary links, installs and reports its version and feature set, but enforcement was not exercised from inside the landstrip session that produced it: a nested engine child writes /memfd:syd, the host sandbox denies that write, and cases end in rc=124 or rc=13. Run 03-smoke.sh in a plain terminal."
