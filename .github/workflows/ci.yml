name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # The suite must run as a normal user: two launcher tests rely on chmod
    # 0500 denying a write, which root ignores (the runner user is non-root).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck corpus/run.sh tools/*.sh
