name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow needs write access to the
# repository, and pinning the actions to full commit SHAs keeps a compromised
# or retagged action from changing under the workflow.
permissions:
  contents: read

jobs:
  unit:
    # The suite must run as a normal user: two launcher tests rely on chmod
    # 0500 denying a write, which root ignores (the runner user is non-root).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck corpus/run.sh tools/*.sh tools/setup/*.sh
