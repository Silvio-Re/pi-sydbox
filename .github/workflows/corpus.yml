name: corpus

# Runner evidence for order P1 (docs/ROADMAP.md): build the pinned engine on
# the CI runner with the repo's own scripts, run the whole corpus, gate the
# run, and publish the sanitized run to the order branch itself.
#
# Two triggers, deliberate:
#   - push to p1-provable-claims (paths below). This is the order's harvest
#     mechanism: nobody in the P1 loop holds workflow-dispatch or
#     artifact-download authority, and the evidence must land in the repo for
#     evidence-first review anyway. The paths filter keeps the publish step's
#     own commits from re-triggering, and GITHUB_TOKEN pushes do not trigger
#     workflows at all, so the loop is double-guarded. Remove the push trigger
#     when P1 merges; the drift cron (P2.3) re-owns the scheduling there.
#   - workflow_dispatch, so a maintainer can still run the band check by
#     hand on any branch once this workflow is on main.
on:
  workflow_dispatch:
  push:
    branches: [p1-provable-claims]
    paths:
      - corpus/**
      - expectations/**
      - tools/**
      - Makefile
      - .github/workflows/corpus.yml

# contents: write for exactly one reason: the publish step commits the run's
# sanitized evidence to the order branch, because no human-held token exists
# in this loop (that was job 5's blocker). Scoped to this workflow; ci.yml
# keeps contents: read. ci.yml does not run on this workflow's own commits
# (GITHUB_TOKEN pushes trigger nothing), so the order's finalizing commit is
# still human-made and re-runs CI as usual.
#
# The publish step runs on failure too: a build that cannot reproduce without
# its logs gets them committed (build-failure/), because anonymous access to
# the Actions log API is admin-only in this loop.
permissions:
  contents: write

env:
  # From syd.lock, unchanged: tag v3.59.0 is commit 7e602aaf... on
  # gitlab.exherbo.org/sydbox/sydbox.git, and the binary sha256 recorded in
  # the lock is checked in the build record.
  SYD_VERSION: "3.59.0"
  SYD_COMMIT: "7e602aaff043121842754002f904694a5e2ed431"

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: toolchain (engine source build prerequisites)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libseccomp-dev xz-utils git python3 openssl
      - name: rust toolchain (floor 1.88, per the engine workspace's rust-version)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
      - name: libseccomp 2.6.0 (source; apt's 2.5.5 cannot link the engine)
        run: |
          set -o pipefail
          bash tools/setup/build-libseccomp.sh 2.6.0 2>&1 | tee "$RUNNER_TEMP/step-libseccomp.txt"
      - name: engine 3.59.0 at the pinned commit (syd.lock)
        run: |
          set -o pipefail
          env PKG_CONFIG_PATH="$HOME/.local/opt/libseccomp-2.6.0/lib/pkgconfig" \
              LIBSECCOMP_LIB_PATH="$HOME/.local/opt/libseccomp-2.6.0/lib" \
              LIBSECCOMP_LINK_TYPE=static \
              bash tools/setup/build-engine.sh "$SYD_VERSION" --commit "$SYD_COMMIT" 2>&1 | tee "$RUNNER_TEMP/step-engine.txt"
      - name: corpus run
        env:
          RUNDIR: results/syd-runner
        run: |
          mkdir -p "$RUNDIR"
          "$HOME/.local/opt/syd-$SYD_VERSION/syd" --version > "$RUNDIR/engine.txt"
          uname -r > "$RUNDIR/uname.txt"
          cp "$RUNNER_TEMP/step-engine.txt" "$RUNDIR/syd-build.txt"
          make corpus LABEL=syd-runner PROFILE=corpus/profiles/syd-a.profile \
               ENGINE='$HOME/.local/opt/syd-3.59.0/syd -P \$PROFILE_FILE --'
      - name: gate (equal-or-stricter vs expectations/, plus the probe-record rules)
        run: |
          set -o pipefail
          make gate RESULTS=results/syd-runner/summary.tsv 2>&1 | tee results/syd-runner/gate.txt
      - name: publish to the order branch (evidence on success, logs on failure)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            p1-provable-claims) ;;
            *) printf 'not the order branch (%s): leaving the evidence in the artifact only\n' "$GITHUB_REF_NAME"; exit 0 ;;
          esac
          dest="docs/evidence/p1-runner-$GITHUB_RUN_ID"
          run_dir="results/syd-runner"
          mkdir -p "$(dirname "$dest")"
          if compgen -G "$run_dir/*" > /dev/null; then
            mode="run"
            bash tools/sanitize-evidence.sh "$run_dir" "$dest"
            mv "$dest/$(basename "$run_dir")" "$dest/run"
          elif compgen -G "/tmp/pi-sydbox-build/*.log" > /dev/null \
            || compgen -G "$RUNNER_TEMP/step-*.txt" > /dev/null; then
            mode="build-failure"
            mkdir -p "$dest/build-failure"
            # sanitize-evidence.sh takes DEST as a directory and writes the
            # file's basename into it
            for f in /tmp/pi-sydbox-build/*.log; do
              [ -f "$f" ] && bash tools/sanitize-evidence.sh "$f" "$dest/build-failure"
            done
            for f in "$RUNNER_TEMP"/step-*.txt; do
              [ -f "$f" ] && bash tools/sanitize-evidence.sh "$f" "$dest/build-failure"
            done
          else
            printf 'nothing survived to publish\n'; exit 0
          fi
          {
            printf '# P1 runner evidence (workflow run %s): %s\n\n' "$GITHUB_RUN_ID" "$mode"
            if [ "$mode" = run ]; then
              printf 'Engine: '; head -n1 "$dest/run/engine.txt" 2>/dev/null || true
              printf 'Kernel: '; head -n1 "$dest/run/uname.txt" 2>/dev/null || true
              printf '\nBuilt with the repository scripts (tools/setup/, syd.lock pinned); corpus\n'
              printf 'and gate logs are under run/. The order branch, not the artifact, is the\n'
              printf 'record: the artifact is the fallback.\n'
            else
              printf 'The engine build failed before the corpus; the step logs and the build\n'
              printf 'workdir logs are under build-failure/. Diagnose from those, fix the script\n'
              printf 'or its runner prerequisites in this repository, and push again: a paths-\n'
              printf 'matching commit re-runs this workflow itself.\n'
            fi
            printf '\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$dest/README.md"
          # the M1 trap: `git add` skips an ignored .log silently; a leaked
          # evidence file must fail the run instead of quietly vanishing
          while IFS= read -r -d '' f; do
            if git check-ignore -q "$f"; then
              printf 'refused: gitignored evidence file: %s\n' "$f" >&2
              exit 1
            fi
          done < <(find "$dest" -type f -print0)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add "$dest"
          if git diff --cached --quiet; then
            printf 'nothing staged for %s\n' "$dest"; exit 0
          fi
          git commit -m "P1 runner evidence: $mode (workflow run $GITHUB_RUN_ID)"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-syd-runner
          path: results/syd-runner/
          if-no-files-found: warn
